name: Deploy Pain Tracker to Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recover previously blocked Pages deployment b1f4de8
        shell: bash
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          endpoint='https://api.github.com/repos/PunkFloid/pain-tracker/pages/deployments/b1f4de8b3a17f76a5c8e1e700137450c814896be'
          body="$RUNNER_TEMP/blocked-pages-status.json"
          read_status() {
            code=$(curl --silent --show-error --connect-timeout 15 --max-time 30 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -o "$body" -w '%{http_code}' "$endpoint")
            if [ "$code" = '404' ]; then
              state='not_found'
            elif [ "$code" = '200' ]; then
              state=$(jq -r '.status // "unknown_status"' "$body")
            else
              echo "Cannot read blocked deployment: HTTP $code"
              cat "$body"
              exit 1
            fi
            echo "b1f4de8 status: $state"
          }
          is_terminal() {
            case "$state" in
              not_found|succeed|deployment_failed|deployment_content_failed|deployment_cancelled|deployment_lost) return 0 ;;
              *) return 1 ;;
            esac
          }
          read_status
          if is_terminal; then
            echo 'Old deployment is already terminal; nothing to cancel.'
            exit 0
          fi
          code=$(curl --silent --show-error --connect-timeout 15 --max-time 30 \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -o "$body" -w '%{http_code}' "$endpoint/cancel")
          if [[ ! "$code" =~ ^2[0-9][0-9]$ ]]; then
            echo "Cancellation failed: HTTP $code"
            cat "$body"
            exit 1
          fi
          echo 'Cancellation requested for b1f4de8 only.'
          for attempt in {1..30}; do
            sleep 5
            read_status
            if is_terminal; then
              echo 'Old deployment released; continuing with latest main.'
              exit 0
            fi
          done
          echo 'GitHub has not released the old deployment. Stopping instead of creating another one.'
          exit 1
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
